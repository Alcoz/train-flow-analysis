[project]
name = "delay-prediction"
version = "0.1.0"
description = "Delay prediction of SNCF trains: training datasets, models and their tracking in MLflow"
readme = "README.md"
authors = [
    { name = "Baptiste Darnala", email = "darnala.b@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "data-eng",
    "mlflow>=3.18.0",
    "polars>=1.40.1",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
data-eng = { workspace = true }
