version: 1

# Silver data of a run is read for one date, the `today` var set by Dagster
# from the partition key, except the GTFS tables read over several versions.
# Columns of every Silver table: data-eng/docs/silver_tables.md
sources:
  - name: silver
    tables:
      # Every GTFS version (date=*): int_planned_trains looks for trains in the
      # last 30 versions. filename = true gives the version of each row (see the
      # gtfs_version macro); filtering on it makes DuckDB read only the files of
      # the versions kept.
      - name: trips
        description: "Trips of every theoretical GTFS version, with the file name holding the version date."
        meta:
          external_location: "read_parquet('s3://sncf-bucket/data/silver/theory/date=*/trips.parquet', hive_partitioning = false, filename = true)"
          dagster:
            asset_key: ["sncf_silver_theoretical_data", "trips"]

      - name: calendar_dates
        description: "Days each service_id runs on, for every theoretical GTFS version, with the file name holding the version date."
        meta:
          # hive_partitioning = false: otherwise DuckDB replaces the file's
          # `date` column (service day) with the `date=` folder value.
          external_location: "read_parquet('s3://sncf-bucket/data/silver/theory/date=*/calendar_dates.parquet', hive_partitioning = false, filename = true)"
          dagster:
            asset_key: ["sncf_silver_theoretical_data", "calendar_dates"]

      - name: routes
        meta:
          external_location: "s3://sncf-bucket/data/silver/theory/date={{ var('today', run_started_at.strftime('%Y-%m-%d')) }}/routes.parquet"
          dagster:
            asset_key: ["sncf_silver_theoretical_data", "routes"]

      - name: stops
        meta:
          external_location: "s3://sncf-bucket/data/silver/theory/date={{ var('today', run_started_at.strftime('%Y-%m-%d')) }}/stops.parquet"
          dagster:
            asset_key: ["sncf_silver_theoretical_data", "stops"]

      # Every fetch day (date=*), filtered on the file name by dim_alerts: a
      # glob on a single day would fail before 2026-10-07, when alerts were
      # not collected yet, instead of returning no rows.
      - name: alerts
        description: "Service alerts snapshots of every fetch day, one row per alert and snapshot, with the file name holding the fetch day."
        meta:
          external_location: "read_parquet('s3://sncf-bucket/data/silver/alerts/date=*/*.parquet', hive_partitioning = false, filename = true)"
          dagster:
            asset_key: ["sncf_silver_alerts_data"]

      - name: trip_updates
        description: "Real-time snapshots of the trips started on the service date, whatever their fetch day."
        meta:
          external_location: "s3://sncf-bucket/data/silver/continue/date={{ var('today', run_started_at.strftime('%Y-%m-%d')) }}/*.parquet"
          dagster:
            asset_key: ["sncf_silver_continue_data"]
