models:
  - name: dim_routes
    description: "Daily snapshots of the train routes from the theoretical GTFS feed."
    config:
      meta:
        purpose: "Line names of the weekly views."
        status: active
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [route_id, date]
        warn_unsupported: false
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [route_id, date]
    columns:
      - name: route_id
        data_type: varchar
        data_tests: [not_null]
      - name: route_short_name
        data_type: varchar
      - name: route_long_name
        data_type: varchar
      - name: terminal_station_1
        description: "First station of route_long_name, null when the name has no ' - ' separator."
        data_type: varchar
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: terminal_station_2
        description: "Last station of route_long_name, null when the name has no ' - ' separator."
        data_type: varchar
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: date
        description: "Date of the theoretical GTFS version this row comes from."
        data_type: date
        data_tests: [not_null]

  - name: dim_dates
    description: "Calendar dimension, one row per day."
    config:
      meta:
        purpose: "Calendar checked by the relationships tests of fact_train_trips."
        status: active
      contract: {enforced: true}
    columns:
      - name: date_day
        data_type: date
        constraints:
          - type: primary_key
            warn_unsupported: false
        data_tests: [unique, not_null]
      - name: day_of_week_iso
        data_type: integer
      - name: day_of_week_name
        data_type: varchar
      - name: day_of_week_name_short
        data_type: varchar
      - name: day_of_month
        data_type: bigint
      - name: day_of_year
        data_type: bigint
      - name: iso_week_start_date
        data_type: date
      - name: iso_week_of_year
        data_type: integer
      - name: month_of_year
        data_type: integer
      - name: month_name
        data_type: varchar
      - name: month_name_short
        data_type: varchar
      - name: year_number
        data_type: integer

  - name: fact_train_trips
    description: "One row per train of the service date: announced trains (int_planned_trains) and trains added in real time, with their status, observation and delay at the effective terminus."
    config:
      meta:
        purpose: "Train-level grain of indicators 1 to 4, source of agg_daily_route and fact_train_alerts."
        status: active
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [trip_id, date]
        warn_unsupported: false
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trip_id, date]
    columns:
      - name: date
        description: "Service day."
        data_type: date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: trip_id
        description: "GTFS trip_id, or real-time trip_id for trains added in real time."
        data_type: varchar
        data_tests: [not_null]
      - name: train_number
        description: "Identifier used by alerts ('OCESN862402F')."
        data_type: varchar
      - name: route_id
        description: "Line of the train; null for trains added in real time (the feed never sends route_id)."
        data_type: varchar
      - name: train_status
        description: "planned, late_cancelled (removed from the GTFS less than 3 days before, or CANCELED in real time), deprogrammed (removed earlier) or added (only in the real-time feed)."
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['planned', 'late_cancelled', 'deprogrammed', 'added']
      - name: gtfs_status
        description: "Status from int_planned_trains, null for trains added in real time."
        data_type: varchar
      - name: realtime_status
        description: "Trip schedule_relationship in the last real-time snapshot (SCHEDULED, CANCELED, ADDED), null when not observed."
        data_type: varchar
      - name: is_observed
        description: "The train is in the real-time feed."
        data_type: boolean
        data_tests: [not_null]
      - name: is_cancelled
        description: "Removed from the GTFS before the day or CANCELED in real time."
        data_type: boolean
        data_tests: [not_null]
      - name: is_limited
        description: "The train ran but its planned terminus was skipped."
        data_type: boolean
        data_tests: [not_null]
      - name: terminus_stop_id
        description: "Effective terminus: last stop actually served."
        data_type: varchar
      - name: terminus_arrival_delay
        description: "Arrival delay at the effective terminus in the last snapshot, in seconds; negative when early."
        data_type: bigint
      - name: last_fetched_at
        description: "Time of the last real-time snapshot of the train (UTC)."
        data_type: timestamp

  - name: agg_daily_route
    description: "Daily counts per line from fact_train_trips. Only counts and sums: weeks are sums of days and rates are computed when reading. Trains added in real time are under a null route_id."
    config:
      meta:
        purpose: "Daily counts behind the weekly views of indicators 1 to 4."
        status: active
      contract: {enforced: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, route_id]
    columns:
      - name: date
        description: "Service day."
        data_type: date
        data_tests: [not_null]
      - name: route_id
        description: "Line; null for trains added in real time."
        data_type: varchar
      - name: announced_trains
        description: "Trains in at least one of the last 30 GTFS versions: denominator of the cancellation indicators."
        data_type: bigint
        data_tests: [not_null]
      - name: planned_trains
        description: "Announced trains that ran or were not cancelled."
        data_type: bigint
        data_tests: [not_null]
      - name: late_cancelled_trains
        description: "Removed from the GTFS less than 3 days before, or CANCELED in real time (indicator 2b)."
        data_type: bigint
        data_tests: [not_null]
      - name: deprogrammed_trains
        description: "Removed from the GTFS 3 days or more before (indicator 2a)."
        data_type: bigint
        data_tests: [not_null]
      - name: added_trains
        description: "Trains only in the real-time feed (not announced)."
        data_type: bigint
        data_tests: [not_null]
      - name: observed_trains
        description: "Trains seen in the real-time feed."
        data_type: bigint
        data_tests: [not_null]
      - name: limited_trains
        description: "Trains that ran without reaching their planned terminus."
        data_type: bigint
        data_tests: [not_null]
      - name: delay_measured_trains
        description: "Trains that ran with a delay at their effective terminus."
        data_type: bigint
        data_tests: [not_null]
      - name: terminus_delay_seconds
        description: "Sum of the delays at the effective terminus, early arrivals counted as 0 (indicator 1)."
        data_type: bigint
        data_tests: [not_null]

  - name: fact_train_alerts
    description: "One row per alert and affected train of the service date: the alert lists the train number in its last version of the day, and the day falls within one of its active periods. Keys: (alert_id, date) to dim_alerts, (route_id, date) to dim_routes, date to dim_dates. Not checked by relationships tests: the dimensions are built by other jobs, whose DuckDB this run cannot see."
    config:
      meta:
        purpose: "Trains affected by alerts, behind the weekly views of indicators 5 to 7."
        status: active
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [alert_id, trip_id, date]
        warn_unsupported: false
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [alert_id, trip_id, date]
    columns:
      - name: date
        description: "Service day."
        data_type: date
        data_tests: [not_null]
      - name: alert_id
        description: "With date, key to dim_alerts (category, reason, texts)."
        data_type: varchar
        data_tests: [not_null]
      - name: trip_id
        description: "trip_id of the train in fact_train_trips."
        data_type: varchar
        data_tests: [not_null]
      - name: train_number
        description: "Train number listed by the alert ('OCESN862402F')."
        data_type: varchar
        data_tests: [not_null]
      - name: route_id
        description: "Line of the train; null for trains added in real time."
        data_type: varchar
      - name: train_status
        description: "Status of the train in fact_train_trips (planned, late_cancelled, deprogrammed, added)."
        data_type: varchar
        data_tests: [not_null]

  - name: int_planned_trains
    description: "Trains announced for the run date (in at least one of the last 30 GTFS versions), with their GTFS status. Denominator of the cancellation indicators and join target of the alerts."
    config:
      meta:
        purpose: "Announced trains: denominator of indicators 2a to 2c and join target of the alerts."
        status: active
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [trip_id, date]
        warn_unsupported: false
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [trip_id, date]
      # Alerts only give a train number: it must point to one train per day.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [train_number, date]
          config:
            severity: warn
    columns:
      - name: date
        description: "Service day."
        data_type: date
        data_tests: [not_null]
      - name: train_number
        description: "trip_id cut after the letter that follows the digits ('OCESN862402F'): the identifier used by alerts."
        data_type: varchar
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: trip_id
        description: "trip_id in the last GTFS version announcing the train."
        data_type: varchar
        data_tests: [not_null]
      - name: route_id
        description: "route_id in the last GTFS version announcing the train."
        data_type: varchar
        data_tests: [not_null]
      - name: last_gtfs_version
        description: "Last GTFS version (publication day) announcing the train."
        data_type: date
        data_tests: [not_null]
      - name: gtfs_status
        description: "planned (in the GTFS of the day), late_cancelled (removed less than 3 days before) or deprogrammed (removed earlier)."
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['planned', 'late_cancelled', 'deprogrammed']

  - name: dim_alerts
    description: "Alert dimension: service alerts present in the feed on the run date, in their last version of the day, with the category and reason given by alert_classification_rules. Daily snapshot keyed by (alert_id, date). Written to Gold so that fact_train_alerts, built by another job, can read it."
    config:
      meta:
        purpose: "Alert attributes (category, reason, texts) for fact_train_alerts and the weekly alert views."
        status: active
      contract: {enforced: true}
    constraints:
      - type: primary_key
        columns: [alert_id, date]
        warn_unsupported: false
    # An alert can stay in the feed for several days, so alert_id alone
    # repeats across the date partitions read by the test.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [alert_id, date]
    columns:
      - name: date
        description: "Fetch day of the snapshots (Europe/Paris)."
        data_type: date
        data_tests: [not_null]
      - name: alert_id
        description: "Not unique across days: an alert can stay in the feed for several days."
        data_type: varchar
        data_tests: [not_null]
      - name: cause
        description: "GTFS-RT cause, null when the SNCF did not set it."
        data_type: varchar
      - name: header_text
        description: "French header, cleaned of its HTML."
        data_type: varchar
      - name: description_text
        description: "French description, cleaned of its HTML."
        data_type: varchar
      - name: active_periods
        description: "Periods the alert is active in (UTC); a null start or end means open on that side."
        data_type: 'STRUCT("start" TIMESTAMP, "end" TIMESTAMP)[]'
      - name: informed_entities
        description: "Targets of the alert; trip_id is a train number (e.g. OCESN862402F), not a GTFS trip_id."
        data_type: "STRUCT(trip_id VARCHAR, route_id VARCHAR, stop_id VARCHAR)[]"
      - name: fetched_at
        description: "Time of the snapshot the alert version comes from (UTC)."
        data_type: timestamp
        data_tests: [not_null]
      - name: rule_id
        description: "Rule that labelled the alert, null when none matched."
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('alert_classification_rules')
                field: rule_id
      - name: category
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['travaux', 'incident', 'information_voyageur', 'autre']
      - name: reason
        description: "Reason shown in the dashboards, null for the 'autre' category."
        data_type: varchar
