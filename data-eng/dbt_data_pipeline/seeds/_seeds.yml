seeds:
  - name: alert_classification_rules
    description: >
      Rules that label GTFS-RT service alerts, whose cause and effect fields
      carry almost no information. Each rule is a regex matched against
      lower(strip_accents(header || ' | ' || description)) of the French
      translation; an alert takes the matching rule with the lowest priority
      (ties broken by rule_id). Root causes (people on tracks, animals, weather)
      have a lower priority than their consequences (signalling, power supply).
    config:
      # Loaded in every daily run: the run's DuckDB is in memory
      tags: ["daily"]
      column_types:
        rule_id: varchar
        priority: integer
        cause_filter: varchar
        pattern: varchar
        category: varchar
        reason: varchar
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
      - name: priority
        description: "Lowest priority wins when several rules match an alert."
        data_tests: [not_null]
      - name: cause_filter
        description: "Rule only applies to alerts with this cause; 'absent' means the cause field is not set. Null applies to every alert."
        data_tests:
          - accepted_values:
              arguments:
                values: ['MAINTENANCE', 'OTHER_CAUSE', 'absent']
      - name: pattern
        description: "RE2 regex, written lowercase and without accents (except œ, which strip_accents keeps)."
        data_tests: [not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['travaux', 'incident', 'information_voyageur']
      - name: reason
        description: "Label shown in the dashboards; 'Non précisée' when the alert gives no reason."
        data_tests: [not_null]
