[project]
name = "orchestration-dagster"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.17",
    "dagster-dbt>=0.29.17",
    "dagster-docker>=0.29.17",
    "dagster-postgres>=0.29.17",
    "data-eng",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "orchestration_dagster"
code_location_name = "orchestration_dagster"
registry_modules = [
    "orchestration_dagster.components.*",
]

[tool.uv.sources]
data-eng = { workspace = true }


