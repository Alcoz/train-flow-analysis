# Schedule ticks are kept forever by default; the `*/2` and `*/5` getter
# schedules alone create ~1000 ticks a day. The daemon purges them hourly.
retention:
  schedule:
    purge_after_days: 14
  sensor:
    purge_after_days:
      skipped: 7
      success: 14
      failure: 30

# A backfill queues one run per partition at once; they all share the code
# server's container with the getters, whose data can't be fetched later.
# Backfill runs (auto-tagged dagster/backfill) go one at a time; other runs
# are not limited.
concurrency:
  runs:
    tag_concurrency_limits:
      - key: "dagster/backfill"
        limit: 4
