type: dagster_dbt.DbtProjectComponent

# Third component on the same dbt project, for the features of the delay
# prediction: their partitions include the current day (see partitions.py).
template_vars_module: .template_vars
attributes:
  project: '{{ context.project_root }}/../data-eng/dbt_data_pipeline'
  # Distinct op names: the components run the same dbt project
  op:
    name: dbt_ml
  select: "tag:ml"
  cli_args:
    - build
    - --vars:
        today: "{{ partition_key }}"

post_processing:
  assets:
    - target: "*"
      attributes:
        partitions_def: "{{ ml_features_partitions }}"
